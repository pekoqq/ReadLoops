[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readloops"
version = "2.13.1"
description = "AI 驱动的英语阅读训练器：可理解输入 + FSRS 间隔重复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fangyuan2711" }]
keywords = ["english", "reading", "fsrs", "spaced-repetition", "cet4", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/pekoqq/ReadLoops"
Repository = "https://github.com/pekoqq/ReadLoops"
"Issue Tracker" = "https://github.com/pekoqq/ReadLoops/issues"
Changelog = "https://github.com/pekoqq/ReadLoops/blob/main/docs/CHANGELOG.md"

[project.scripts]
readloops = "app.cli:main"

[project.optional-dependencies]
# 语法检测 / 长难句识别 / 具体性检测（文章质量评分器的核心）
nlp = ["spacy>=3.8"]

dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]

[tool.setuptools]
packages = ["app", "app.api", "app.services"]

[tool.setuptools.package-data]
# resources/ 里有运行必需的 form_index.json（词形还原索引）与 exam_topics.json
app = ["web/*", "web/**/*", "resources/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "app/web"]

[tool.ruff.lint]
# 保守起步：只启用能抓真实问题的规则集，避免一次性引入海量告警
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # 行宽交给 formatter
    "E402",  # 允许模块级 import 不在顶部（部分脚本依赖路径设置）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"tools/*" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
