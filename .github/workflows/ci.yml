name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 检查与测试 (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 运行测试（pytest）
        run: pytest

  package:
    name: 打包与安装验证 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 安装并验证命令行
        shell: bash
        env:
          READLOOPS_DATA_DIR: ${{ runner.temp }}/rl-data
        run: |
          pip install dist/*.whl
          readloops --help
          readloops init
          test -f "$READLOOPS_DATA_DIR/yuedu.db" && echo "数据库创建成功"
          readloops doctor || true
