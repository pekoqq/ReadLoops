name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 检查与测试 (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 运行测试（pytest）
        run: pytest

  package:
    name: 打包与安装验证 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 安装并验证命令行
        shell: bash
        env:
          READLOOPS_DATA_DIR: ${{ runner.temp }}/rl-data
          PYTHONIOENCODING: utf-8
        run: |
          pip install dist/*.whl
          readloops --help
          readloops init
          test -f "$READLOOPS_DATA_DIR/yuedu.db" && echo "数据库创建成功"
          readloops doctor || true

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: readloops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并验证
        run: |
          docker run -d --name rl -p 127.0.0.1:8000:8000 readloops:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "健康检查通过"; exit 0
            fi
            sleep 2
          done
          echo "健康检查超时"; docker logs rl; exit 1
